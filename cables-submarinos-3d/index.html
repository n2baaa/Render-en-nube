<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Cap'; src: url('/motor/fuentes/bricolage-700.ttf') format('truetype'); font-weight: 800; }
@font-face { font-family: 'Sub'; src: url('/motor/fuentes/figtree-700.woff2') format('woff2'); font-weight: 700; }
@font-face { font-family: 'Mono'; src: url('/motor/fuentes/jetbrainsmono-700.woff') format('woff'); font-weight: 700; }
html, body { margin: 0; background: #000; overflow: hidden; user-select: none; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
/* Rótulo Recreación / Fuente (esquina superior izquierda) */
#badge {
  position: absolute; top: 58px; left: 54px;
  padding: 10px 22px; border-radius: 999px;
  background: rgba(15, 18, 26, 0.82); border: 2px solid rgba(255, 246, 224, 0.35);
  font: 700 24px/1 'Mono', monospace; color: #fff6e0; letter-spacing: 1.5px; text-transform: uppercase;
  box-shadow: 0 6px 20px rgba(0,0,0,0.35);
}
/* Titular / Frase Clave superior (estilo Josué 3D) */
.cap {
  position: absolute; top: 140px; left: 40px; width: 1000px; text-align: center;
  font: 800 66px/1.14 'Cap', sans-serif; color: #1c1a17; letter-spacing: -1px;
  text-shadow: 0 0 16px #fff6e0, 0 0 6px #fff6e0, 0 4px 0 #fff6e0;
  pointer-events: none;
}
.cap.danger { color: #df3b30; text-shadow: 0 0 18px #fff6e0, 0 0 6px #fff6e0, 0 4px 0 #1c1a17; }
.cap.light { color: #ffffff; text-shadow: 0 0 18px rgba(0,0,0,0.85), 0 4px 0 #1c1a17; }
.cap.accent { color: #00e5ff; text-shadow: 0 0 18px rgba(0,0,0,0.9), 0 4px 0 #0d1b2a; }
.cap span { display: inline-block; margin: 0 0.12em; }
/* Píldora / Chip discreto de telemetría (≤ 15 % del antiguo 900×300: 420×92 px = 38 640 px² · 14,3 %) */
#panel {
  position: absolute; top: 298px; left: 330px; width: 420px; height: 92px; box-sizing: border-box;
  background: rgba(11, 15, 24, 0.62); border: 2px solid rgba(255, 246, 224, 0.34); border-radius: 999px;
  backdrop-filter: blur(8px);
  overflow: hidden; opacity: 0; box-shadow: 0 8px 24px rgba(0,0,0,0.32);
  pointer-events: none;
}
#panel svg { width: 100%; height: 100%; display: block; }
/* Subtítulos palabra a palabra sincronizados (zona segura Reels y=1440px) */
#sub {
  position: absolute; top: 1430px; left: 60px; width: 960px; text-align: center;
  font: 700 58px/1.22 'Sub', sans-serif; color: #ffffff;
  text-shadow: 0 4px 16px rgba(0,0,0,0.92), 0 2px 4px rgba(0,0,0,0.95);
  pointer-events: none;
}
#sub span {
  display: inline-block; margin: 0 0.11em; padding: 2px 10px; border-radius: 12px;
  transition: none;
}
#sub span.kw-danger { background: #df3b30; color: #fff; font-family: 'Cap', sans-serif; }
#sub span.kw-accent { background: #2fb7f5; color: #0d131a; font-family: 'Cap', sans-serif; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="badge">RECREACIÓN · DATOS VERIFICADOS</div>
  <div id="cap" class="cap"></div>
  <div id="panel"></div>
  <div id="sub"></div>
</div>
<script src="voz/timeline.js"></script>
<script src="bundle.js"></script>
</body>
</html>
